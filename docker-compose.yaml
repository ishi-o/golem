# A profile per persistence backend, so the containers can never drift from
# what the application itself selected. The app service is intentionally
# absent: Golem runs from source during
# development (`go run ./app`) and from whatever image the deployment builds.
#
#   docker compose --profile mongodb up
#   docker compose --profile redis up

services:
  mongodb:
    image: mongo:8
    ports:
      - "${MONGODB_HOST_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mongodb-data:/data/db
    profiles: [mongodb]

  redis:
    image: redis:8
    # Golem's Redis backend keeps the agent's own records — pending questions,
    # scheduled tasks, shell credentials — not a cache. noeviction plus AOF is
    # the contract: a Redis provisioned the usual way for caching is free to
    # evict a task that has not fired yet, and will do so silently.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    profiles: [redis]

volumes:
  mongodb-data:
  redis-data:
