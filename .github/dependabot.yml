version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - '/core'
      - '/store/sqlx'
      - '/store/mongodb'
      - '/store/redis'
      - '/sandbox/docker'
      - '/sandbox/kubernetes'
      - '/connector/feishu'
      - '/test'
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: k8s.io/*
      - dependency-name: go.opentelemetry.io/otel
        versions: ['>= 1.39.0']
      - dependency-name: go.opentelemetry.io/contrib/*
        versions: ['>= 0.64.0']
      - dependency-name: google.golang.org/grpc
        versions: ['>= 1.76.0']
      - dependency-name: golang.org/x/crypto
        versions: ['>= 0.37.0']
      - dependency-name: golang.org/x/net
        versions: ['>= 0.37.0']
      - dependency-name: sigs.k8s.io/yaml
        versions: ['>= 1.5.0']
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
