version: 2
updates:
  # Go modules: direct dependencies only. Dependabot must never rewrite
  # indirect require lines: doing so historically pinned x/crypto & friends
  # at go-1.25 versions and forced the module go directives up (see the
  # go<=1.23 policy enforced by go.work). Capped families are ignored above
  # their ceiling.
  - &golang
    package-ecosystem: golang
    directory: /core
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: k8s.io/*
      - dependency-name: go.opentelemetry.io/*
        versions: ['>= 1.39.0']
      - dependency-name: go.opentelemetry.io/contrib/*
        versions: ['>= 0.64.0']
      - dependency-name: google.golang.org/grpc
        versions: ['>= 1.76.0']
      - dependency-name: golang.org/x/*
        versions: ['>= 0.37.0']
      - dependency-name: k8s.io/kube-openapi
      - dependency-name: sigs.k8s.io/yaml
        versions: ['>= 1.5.0']
  - <<: *golang
    directory: /store/sqlx
  - <<: *golang
    directory: /store/mongodb
  - <<: *golang
    directory: /store/redis
  - <<: *golang
    directory: /sandbox/docker
  - <<: *golang
    directory: /sandbox/kubernetes
  - <<: *golang
    directory: /connector/feishu
  - <<: *golang
    directory: /test
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
