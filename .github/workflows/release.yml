name: release

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.github/**'
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.github/**'
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: make build
      - run: make check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: make test

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: codeql-${{ runner.os }}-go-${{ hashFiles('**/go.sum', 'go.work') }}
          restore-keys: codeql-${{ runner.os }}-go-
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/analyze@v3
        with:
          queries: ${{ github.event_name == 'pull_request' && 'security' || 'security-extended' }}

  release:
    if: github.event_name == 'push'
    needs: [check, test, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: googleapis/release-please-action@v4
        id: release
