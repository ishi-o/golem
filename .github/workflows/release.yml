name: release

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - 'script/**'
      - '.github/**'
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - 'script/**'
      - '.github/**'
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: make build
      - run: make check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: make test

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: manual
      - run: make build
      - uses: github/codeql-action/analyze@v3
        with:
          queries: ${{ github.event_name == 'pull_request' && 'security' || 'security-extended' }}

  release:
    if: github.event_name == 'push'
    needs: [check, test, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup-go
      - uses: googleapis/release-please-action@v4
        id: release
      - name: Sync sibling module versions
        if: steps.release.outputs.releases_created == 'true'
        env:
          PATHS: ${{ steps.release.outputs.paths_released }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash script/sync-module-versions.sh
      - name: Package the released modules
        if: steps.release.outputs.releases_created == 'true'
        env:
          PATHS: ${{ steps.release.outputs.paths_released }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash script/package-modules.sh
