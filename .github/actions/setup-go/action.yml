name: setup-go
description: Set up Go from the workspace's go.work directive, and cache module downloads and the build cache
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.work
        cache: true
        cache-dependency-path: '**/go.sum'
    - uses: actions/cache@v4
      with:
        path: ~/.cache/go-build
        key: go-build-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum') }}
        restore-keys: go-build-${{ runner.os }}-
